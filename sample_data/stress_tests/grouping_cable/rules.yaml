schema_version: 1
hardware:
  cabinets: 1
  ciocs_per_cabinet: 1
  baseplates_per_cioc: 1
  charms_per_baseplate: 12
rules:
- id: synthetic_spares
  type: spare_capacity
  enabled: true
  level: global
  basis: available
  minimum_percent: 5
- id: synthetic_groups
  type: group_together
  enabled: true
  group_by: group
  level: cabinet
  severity: hard
- id: synthetic_redundancy
  type: separation
  enabled: true
  group_by: redundancy_group
  side_by: redundancy_side
  level: cioc
  severity: hard
- id: synthetic_cable_pairs
  type: cable_pair_order
  enabled: true
  group_by: cable
  order_by: pair
  severity: hard
compatibility:
  enabled: true
  require_charm_type: true
  require_terminal_block_type: true
  require_isolation: true
  require_fusing: true
  require_injected_power: true
optimization:
  preserve_previous_assignments: true
  move_penalty: 100
  time_limit_seconds: 30
  num_search_workers: 1
  random_seed: 0
